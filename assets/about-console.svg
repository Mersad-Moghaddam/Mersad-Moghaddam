<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="about-title about-desc">
  <title id="about-title">About Mersad Moghaddam</title>
  <desc id="about-desc">A backend engineer identity console focused on Go, bounded concurrency, predictable failures, and useful signals.</desc>
  <defs>
    <linearGradient id="about-bg" x1="24" y1="18" x2="1160" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset=".6" stop-color="#111A25"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="about-accent" x1="38" y1="0" x2="1125" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset=".5" stop-color="#00ADD8"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
    <pattern id="about-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#8B949E" stroke-opacity=".055"/>
    </pattern>
    <filter id="about-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <style>
    text { font-family:"DejaVu Sans Mono",Consolas,"Liberation Mono",monospace; }
    @media (prefers-reduced-motion: reduce) { animate { display:none; } }
  </style>

  <rect x="1" y="1" width="1198" height="278" rx="15" fill="url(#about-bg)" stroke="#30363D" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="278" rx="15" fill="url(#about-grid)"/>
  <path d="M1 42H1199" stroke="#30363D"/>
  <circle cx="22" cy="21" r="6" fill="#FF5F56"/>
  <circle cx="42" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="62" cy="21" r="6" fill="#3FB950"/>
  <text x="600" y="26" text-anchor="middle" fill="#8B949E" font-size="12">identity.service · /about</text>
  <text x="1168" y="26" text-anchor="end" fill="#3FB950" font-size="11">● ONLINE</text>

  <g transform="translate(38 66)">
    <rect width="690" height="186" rx="11" fill="#090D12" stroke="#21262D"/>
    <rect x="20" y="20" width="78" height="28" rx="14" fill="#00ADD8" stroke="#00ADD8"/>
    <text x="59" y="39" text-anchor="middle" fill="#0D1117" font-size="12" font-weight="700">WHOAMI</text>
    <text x="20" y="86" fill="#F0F6FC" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700">Mersad Moghaddam</text>
    <text x="20" y="116" fill="#58A6FF" font-size="15">BACKEND ENGINEER · GO DEVELOPER</text>
    <text x="20" y="150" fill="#C9D1D9" font-size="13">Concurrent services, data-heavy APIs, observable systems.</text>
    <text x="20" y="174" fill="#8B949E" font-size="12">Mashhad, Iran  /  simple boundaries  /  calm production</text>

    <g transform="translate(608 34)">
      <circle r="38" fill="#0D1117" stroke="#00ADD8" stroke-width="1.5"/>
      <circle r="31" stroke="#00ADD8" stroke-opacity=".3" stroke-dasharray="3 5">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="14s" repeatCount="indefinite"/>
      </circle>
      <text y="8" text-anchor="middle" fill="#00ADD8" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700">Go</text>
    </g>
  </g>

  <g transform="translate(754 66)">
    <rect width="408" height="186" rx="11" fill="#0D1117" fill-opacity=".76" stroke="#21262D"/>
    <text x="18" y="27" fill="#8B949E" font-size="11">PRODUCTION DEFAULTS</text>
    <g transform="translate(18 48)">
      <circle cx="6" cy="6" r="6" fill="#3FB950"/>
      <circle cx="6" cy="6" r="10" fill="#3FB950" opacity=".14" filter="url(#about-glow)">
        <animate attributeName="opacity" values=".12;.38;.12" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="11" fill="#C9D1D9" font-size="13">concurrency</text>
      <text x="370" y="11" text-anchor="end" fill="#3FB950" font-size="12">BOUNDED</text>
      <rect y="27" width="370" height="4" rx="2" fill="#21262D"/>
      <rect y="27" width="312" height="4" rx="2" fill="#3FB950"/>
    </g>
    <g transform="translate(18 96)">
      <circle cx="6" cy="6" r="6" fill="#58A6FF"/>
      <text x="24" y="11" fill="#C9D1D9" font-size="13">failure mode</text>
      <text x="370" y="11" text-anchor="end" fill="#58A6FF" font-size="12">PREDICTABLE</text>
      <rect y="27" width="370" height="4" rx="2" fill="#21262D"/>
      <rect y="27" width="332" height="4" rx="2" fill="#58A6FF"/>
    </g>
    <g transform="translate(18 144)">
      <circle cx="6" cy="6" r="6" fill="#00ADD8"/>
      <text x="24" y="11" fill="#C9D1D9" font-size="13">telemetry</text>
      <text x="370" y="11" text-anchor="end" fill="#00ADD8" font-size="12">USEFUL</text>
      <rect y="27" width="370" height="4" rx="2" fill="#21262D"/>
      <rect y="27" width="348" height="4" rx="2" fill="#00ADD8"/>
    </g>
  </g>
</svg>
