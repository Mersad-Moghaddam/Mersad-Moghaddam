      <text x="32" y="48" text-anchor="middle" fill="#D29922" font-size="9">STREAM</text>
    </g>
    <g transform="translate(296 0)">
      <rect width="70" height="64" rx="10" fill="#161B22" stroke="#00ADD8"/>
      <circle cx="20" cy="22" r="8" fill="#0D1117" stroke="#00ADD8"/><circle cx="49" cy="22" r="8" fill="#0D1117" stroke="#00ADD8"/>
