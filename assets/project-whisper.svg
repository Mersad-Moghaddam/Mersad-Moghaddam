      <circle r="4" fill="#00ADD8"><animateMotion path="M208 32H296" begin=".45s" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle r="4" fill="#3FB950"><animateMotion path="M366 32H472" begin=".9s" dur="1.4s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(0 4)">
