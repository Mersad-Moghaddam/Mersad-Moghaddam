<svg xmlns="http://www.w3.org/2000/svg" width="500" height="320" viewBox="0 0 500 320" role="img" aria-labelledby="title desc">
<title id="title">Whisper Social</title><desc id="desc">A social backend that processes timeline updates in the background using Redis Streams, keeping post creation separate from the work of updating followers’ feeds.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'DejaVu Sans Mono',Consolas,monospace}.packet{animation:travel 4s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.cursor{animation:blink 1.2s steps(1) infinite}@keyframes travel{to{stroke-dashoffset:-100}}@keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="500" height="320" fill="#090D15"/><rect x="10" y="9" width="480" height="300" rx="10" fill="#101827" stroke="#26354C"/><path d="M11 28V290" stroke="#85AFFF" stroke-width="2"/><text x="34" y="50" font-size="25" fill="#EDF3FC" font-weight="700">Whisper Social</text><text x="447" y="49" font-size="22" fill="#85AFFF">↗</text><text x="34" y="76" font-size="10" fill="#85AFFF" class="mono">Backend services / background processing</text><text x="34" y="108" font-size="13" fill="#A0AEC5">A social backend that processes timeline updates in the</text><text x="34" y="130" font-size="13" fill="#A0AEC5">background using Redis Streams, keeping post creation separate</text><text x="34" y="152" font-size="13" fill="#A0AEC5">from the work of updating followers’ feeds.</text><svg x="36" y="201" width="408" height="71" viewBox="0 0 380 66"><path d="M65 33H315" stroke="#314e79"/><path class="packet" d="M65 33H315" stroke="#85afff" stroke-dasharray="3 30"/><g fill="#15253c" stroke="#4a6eaa"><rect x="15" y="20" width="70" height="26" rx="5"/><rect x="135" y="20" width="96" height="26" rx="5"/><rect x="285" y="20" width="80" height="26" rx="5"/></g><g fill="#aecafa" font-family="monospace" font-size="9" text-anchor="middle"><text x="50" y="37">post</text><text x="183" y="37">stream</text><text x="325" y="37">fanout</text></g></svg><text x="34" y="290" font-size="10" fill="#91A5C1" class="mono">Go / Redis Streams / MySQL</text></svg>