<svg width="580" height="250" viewBox="0 0 580 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="w-title w-desc">
  <title id="w-title">Whisper Social</title>
  <desc id="w-desc">Event-driven social timelines using Go, Redis Streams, and MySQL.</desc>
  <defs>
    <linearGradient id="w-bg" x1="12" y1="10" x2="560" y2="240" gradientUnits="userSpaceOnUse"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#111A25"/></linearGradient>
    <filter id="w-glow" x="-250%" y="-250%" width="600%" height="600%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <style>
    text { font-family:"DejaVu Sans Mono",Consolas,"Liberation Mono",monospace; }
    @media (prefers-reduced-motion: reduce) { animate,animateMotion,animateTransform { display:none; } }
  </style>
  <rect width="580" height="250" fill="#0D1117"/>
  <rect x="1" width="578" height="250" fill="url(#w-bg)" stroke="#30363D" stroke-width="2"/>
  <path d="M1 38H579" stroke="#30363D"/>
  <text x="20" y="24" fill="#8B949E" font-size="11">01 / whisper.social</text>
  <text x="558" y="24" text-anchor="end" fill="#3FB950" font-size="10">● ONLINE</text>

  <text x="22" y="70" fill="#F0F6FC" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700">Whisper Social</text>
  <text x="558" y="69" text-anchor="end" fill="#58A6FF" font-size="10">EVENT-DRIVEN TIMELINES</text>

  <g transform="translate(25 92)">
