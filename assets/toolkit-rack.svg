  <g transform="translate(28 218)">
    <circle cx="5" cy="5" r="5" fill="#3FB950"><animate attributeName="opacity" values=".45;1;.45" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="18" y="9" fill="#3FB950" font-size="10">toolchain healthy</text>
    <text x="1144" y="9" text-anchor="end" fill="#8B949E" font-size="10">build → ship → observe → improve</text>
  </g>
