<svg width="1200" height="270" viewBox="0 0 1200 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-title loop-desc">
  <title id="loop-title">Mersad’s engineering loop</title>
  <desc id="loop-desc">A personal engineering loop: question, trace, bound, build, measure, simplify, and repeat.</desc>

  <defs>
    <linearGradient id="loop-bg" x1="16" y1="12" x2="1170" y2="262" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset=".55" stop-color="#111A25"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="loop-wire" x1="105" y1="0" x2="1064" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset=".52" stop-color="#00ADD8"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
    <pattern id="loop-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" stroke="#8B949E" stroke-opacity=".05"/>
    </pattern>
    <filter id="loop-glow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <style>
    text { font-family:"DejaVu Sans Mono",Consolas,"Liberation Mono",monospace; }
    @media (prefers-reduced-motion: reduce) {
      animate, animateMotion { display:none; }
      .packet { display:none; }
    }
  </style>

  <rect width="1200" height="270" fill="#0D1117"/>
  <rect x="1" y="1" width="1198" height="268" rx="15" fill="url(#loop-bg)" stroke="#30363D" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="268" rx="15" fill="url(#loop-grid)"/>
  <path d="M1 42H1199" stroke="#30363D"/>
  <circle cx="22" cy="21" r="6" fill="#FF5F56"/>
  <circle cx="42" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="62" cy="21" r="6" fill="#3FB950"/>
  <text x="600" y="26" text-anchor="middle" fill="#8B949E" font-size="12">mersad.engineering.loop · /usr/local/bin/think</text>
  <text x="1168" y="26" text-anchor="end" fill="#3FB950" font-size="10">ITERATION ∞</text>

  <text x="38" y="68" fill="#58A6FF" font-size="11">$</text>
  <text x="55" y="68" fill="#C9D1D9" font-size="11">solve --without-drama</text>
  <text x="1162" y="68" text-anchor="end" fill="#8B949E" font-size="9">MERSAD’S DEFAULT PATH</text>

  <!-- forward path -->
  <path d="M103 126H1063" stroke="#30363D" stroke-width="4" stroke-linecap="round"/>
  <path d="M103 126H1063" stroke="url(#loop-wire)" stroke-width="1.5" stroke-dasharray="5 8">
    <animate attributeName="stroke-dashoffset" values="26;0" dur="3s" repeatCount="indefinite"/>
  </path>
  <g class="packet">
    <circle r="4" fill="#00ADD8">
      <animateMotion path="M103 126H1063" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#00ADD8" opacity=".18" filter="url(#loop-glow)">
      <animateMotion path="M103 126H1063" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 01 question -->
  <g transform="translate(38 86)">
    <rect width="130" height="80" rx="10" fill="#161B22" stroke="#58A6FF"/>
    <circle cx="65" cy="28" r="17" fill="#0D1117" stroke="#58A6FF"/>
    <text x="65" y="35" text-anchor="middle" fill="#58A6FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700">?</text>
    <text x="65" y="58" text-anchor="middle" fill="#F0F6FC" font-size="10">QUESTION</text>
    <text x="65" y="72" text-anchor="middle" fill="#8B949E" font-size="7">FAILURE FIRST</text>
  </g>

  <!-- 02 trace -->
  <g transform="translate(230 86)">
    <rect width="130" height="80" rx="10" fill="#161B22" stroke="#58A6FF"/>
    <path d="M34 30H44L49 19L57 40L64 13L72 30H96" stroke="#58A6FF" stroke-width="2" stroke-linejoin="round"/>
    <text x="65" y="58" text-anchor="middle" fill="#F0F6FC" font-size="10">TRACE</text>
    <text x="65" y="72" text-anchor="middle" fill="#8B949E" font-size="7">READ REALITY</text>
  </g>

  <!-- 03 bound -->
  <g transform="translate(422 86)">
    <rect width="130" height="80" rx="10" fill="#161B22" stroke="#D29922"/>
    <path d="M37 18H30V42H37M93 18H100V42H93" stroke="#D29922" stroke-width="2" stroke-linecap="round"/>
    <rect x="43" y="21" width="10" height="18" rx="2" fill="#D29922"/>
    <rect x="59" y="21" width="10" height="18" rx="2" fill="#D29922"/>
    <rect x="75" y="21" width="10" height="18" rx="2" fill="#D29922"/>
    <text x="65" y="58" text-anchor="middle" fill="#F0F6FC" font-size="10">BOUND</text>
    <text x="65" y="72" text-anchor="middle" fill="#8B949E" font-size="7">OWN THE COST</text>
  </g>

  <!-- 04 build -->
  <g transform="translate(614 86)">
    <rect width="130" height="80" rx="10" fill="#161B22" stroke="#00ADD8" stroke-width="1.5"/>
    <circle cx="65" cy="29" r="18" fill="#0D1117" stroke="#00ADD8"/>
    <text x="65" y="35" text-anchor="middle" fill="#00ADD8" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700">Go</text>
    <text x="65" y="58" text-anchor="middle" fill="#F0F6FC" font-size="10">BUILD</text>
    <text x="65" y="72" text-anchor="middle" fill="#8B949E" font-size="7">SMALL PATH</text>
  </g>

  <!-- 05 measure -->
  <g transform="translate(806 86)">
    <rect width="130" height="80" rx="10" fill="#161B22" stroke="#00ADD8"/>
    <path d="M35 42V17M35 42H97" stroke="#8B949E"/>
    <path d="M40 37L53 29L65 33L78 20L93 24" stroke="#00ADD8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="78" cy="20" r="3" fill="#00ADD8">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="65" y="58" text-anchor="middle" fill="#F0F6FC" font-size="10">MEASURE</text>
    <text x="65" y="72" text-anchor="middle" fill="#8B949E" font-size="7">ASK THE DATA</text>
  </g>

  <!-- 06 simplify -->
  <g transform="translate(998 86)">
    <rect width="130" height="80" rx="10" fill="#161B22" stroke="#3FB950"/>
    <path d="M35 22H95M44 30H86M53 38H77" stroke="#3FB950" stroke-width="2" stroke-linecap="round"/>
    <text x="65" y="58" text-anchor="middle" fill="#F0F6FC" font-size="10">SIMPLIFY</text>
    <text x="65" y="72" text-anchor="middle" fill="#8B949E" font-size="7">REMOVE MORE</text>
  </g>

  <!-- feedback is part of the method, not an afterthought -->
  <path d="M1063 176V210H103V176" stroke="#3FB950" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="5 7">
    <animate attributeName="stroke-dashoffset" values="0;24" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M97 183L103 176L109 183" stroke="#3FB950" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="416" y="197" width="368" height="26" rx="13" fill="#0D1117" stroke="#30363D"/>
  <text x="600" y="214" text-anchor="middle" fill="#8B949E" font-size="9">repeat while the system can become clearer</text>

  <circle cx="38" cy="242" r="5" fill="#3FB950">
    <animate attributeName="opacity" values=".45;1;.45" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="52" y="246" fill="#3FB950" font-size="10">loop healthy</text>
  <text x="1162" y="246" text-anchor="end" fill="#8B949E" font-size="10">understand → constrain → build → learn → simplify</text>
</svg>
