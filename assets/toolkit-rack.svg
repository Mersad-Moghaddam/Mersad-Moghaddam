<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tool-title tool-desc">
  <title id="tool-title">Backend engineering toolkit</title>
  <desc id="tool-desc">A production rack connecting Go, Redis, MySQL, Docker, Linux, Prometheus, and Grafana.</desc>
  <defs>
    <linearGradient id="tool-bg" x1="16" y1="12" x2="1170" y2="250" gradientUnits="userSpaceOnUse"><stop stop-color="#0D1117"/><stop offset=".5" stop-color="#111A25"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
    <linearGradient id="tool-wire" x1="166" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#58A6FF"/><stop offset=".52" stop-color="#00ADD8"/><stop offset="1" stop-color="#3FB950"/></linearGradient>
    <pattern id="tool-grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" stroke="#8B949E" stroke-opacity=".05"/></pattern>
  </defs>
  <style>text{font-family:"DejaVu Sans Mono",Consolas,"Liberation Mono",monospace}@media(prefers-reduced-motion:reduce){animate,animateMotion{display:none}}</style>
  <rect x="1" y="1" width="1198" height="258" rx="15" fill="url(#tool-bg)" stroke="#30363D" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="258" rx="15" fill="url(#tool-grid)"/>
  <path d="M1 42H1199" stroke="#30363D"/>
  <circle cx="22" cy="21" r="6" fill="#FF5F56"/><circle cx="42" cy="21" r="6" fill="#FFBD2E"/><circle cx="62" cy="21" r="6" fill="#3FB950"/>
  <text x="600" y="26" text-anchor="middle" fill="#8B949E" font-size="12">runtime.dependencies · production rack</text>
  <text x="1168" y="26" text-anchor="end" fill="#3FB950" font-size="11">9 / 9 READY</text>

  <g transform="translate(28 65)">
    <text x="0" y="28" fill="#8B949E" font-size="10">CORE</text>
    <path d="M118 24H1115" stroke="#30363D" stroke-width="3"/>
    <path d="M118 24H1115" stroke="url(#tool-wire)" stroke-width="1.5" stroke-dasharray="5 8"><animate attributeName="stroke-dashoffset" values="26;0" dur="3s" repeatCount="indefinite"/></path>
    <g transform="translate(140 0)">
      <rect width="120" height="48" rx="9" fill="#161B22" stroke="#00ADD8"/><text x="60" y="21" text-anchor="middle" fill="#00ADD8" font-size="13" font-weight="700">Go</text><text x="60" y="37" text-anchor="middle" fill="#8B949E" font-size="8">SERVICES</text>
    </g>
    <g transform="translate(322 0)">
      <rect width="120" height="48" rx="9" fill="#161B22" stroke="#58A6FF"/><text x="60" y="21" text-anchor="middle" fill="#58A6FF" font-size="13">Fiber</text><text x="60" y="37" text-anchor="middle" fill="#8B949E" font-size="8">HTTP</text>
    </g>
    <g transform="translate(504 0)">
      <rect width="120" height="48" rx="9" fill="#161B22" stroke="#F85149"/><text x="60" y="21" text-anchor="middle" fill="#F85149" font-size="13">Redis</text><text x="60" y="37" text-anchor="middle" fill="#8B949E" font-size="8">CACHE · QUEUE</text>
    </g>
    <g transform="translate(686 0)">
      <rect width="120" height="48" rx="9" fill="#161B22" stroke="#58A6FF"/><text x="60" y="21" text-anchor="middle" fill="#58A6FF" font-size="13">MySQL</text><text x="60" y="37" text-anchor="middle" fill="#8B949E" font-size="8">STORAGE</text>
    </g>
    <g transform="translate(868 0)">
      <rect width="120" height="48" rx="9" fill="#161B22" stroke="#D29922"/><text x="60" y="21" text-anchor="middle" fill="#D29922" font-size="13">Asynq</text><text x="60" y="37" text-anchor="middle" fill="#8B949E" font-size="8">WORKERS</text>
    </g>
  </g>

  <g transform="translate(28 138)">
    <text x="0" y="28" fill="#8B949E" font-size="10">OPS</text>
    <path d="M118 24H1115" stroke="#30363D" stroke-width="3"/>
    <path d="M118 24H1115" stroke="url(#tool-wire)" stroke-width="1.5" stroke-dasharray="5 8"><animate attributeName="stroke-dashoffset" values="0;26" dur="3.4s" repeatCount="indefinite"/></path>
    <g transform="translate(140 0)">
      <rect width="145" height="48" rx="9" fill="#161B22" stroke="#2496ED"/><text x="73" y="21" text-anchor="middle" fill="#2496ED" font-size="13">Docker</text><text x="73" y="37" text-anchor="middle" fill="#8B949E" font-size="8">SHIP</text>
    </g>
    <g transform="translate(352 0)">
      <rect width="145" height="48" rx="9" fill="#161B22" stroke="#D29922"/><text x="73" y="21" text-anchor="middle" fill="#D29922" font-size="13">Linux</text><text x="73" y="37" text-anchor="middle" fill="#8B949E" font-size="8">RUN</text>
    </g>
    <g transform="translate(564 0)">
      <rect width="145" height="48" rx="9" fill="#161B22" stroke="#F85149"/><text x="73" y="21" text-anchor="middle" fill="#F85149" font-size="13">Prometheus</text><text x="73" y="37" text-anchor="middle" fill="#8B949E" font-size="8">MEASURE</text>
    </g>
    <g transform="translate(776 0)">
      <rect width="145" height="48" rx="9" fill="#161B22" stroke="#F46800"/><text x="73" y="21" text-anchor="middle" fill="#F46800" font-size="13">Grafana</text><text x="73" y="37" text-anchor="middle" fill="#8B949E" font-size="8">SEE</text>
