  <path d="M22 183H558" stroke="#21262D"/>
  <text x="22" y="208" fill="#C9D1D9" font-size="11">keys close to bytes · latency close to metal</text>
  <text x="22" y="230" fill="#00ADD8" font-size="10">Go</text><text x="49" y="230" fill="#484F58">·</text><text x="62" y="230" fill="#D29922" font-size="10">mmap</text><text x="98" y="230" fill="#484F58">·</text><text x="111" y="230" fill="#58A6FF" font-size="10">lock-free CAS</text>
  <text x="558" y="230" text-anchor="end" fill="#8B949E" font-size="10">open repository ↗</text>
