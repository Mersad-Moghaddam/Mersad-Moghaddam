<svg xmlns="http://www.w3.org/2000/svg" width="500" height="320" viewBox="0 0 500 320" role="img" aria-labelledby="title desc">
<title id="title">AetherDB</title><desc id="desc">A key-value store where I explore how storage works, from memory-mapped files and concurrent indexing to zero-copy reads with sendfile.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'DejaVu Sans Mono',Consolas,monospace}.pulse{animation:pulse 3s ease-in-out infinite}svg > svg > path{stroke-dasharray:9 5;animation:flow 2.4s linear infinite}svg > svg > g > rect{animation:pulse 3s ease-in-out infinite}svg > svg > g > rect:nth-child(2){animation-delay:.3s}svg > svg > g > rect:nth-child(3){animation-delay:.6s}svg > svg > g > rect:nth-child(4){animation-delay:.9s}svg > svg > g > rect:nth-child(5){animation-delay:1.2s}@keyframes flow{to{stroke-dashoffset:-28}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="500" height="320" fill="#090D15"/><rect x="10" y="9" width="480" height="300" rx="10" fill="#101827" stroke="#26354C"/><path d="M11 28V290" stroke="#BCA1F5" stroke-width="2"/><text x="34" y="50" font-size="25" fill="#EDF3FC" font-weight="700">AetherDB</text><text x="447" y="49" font-size="22" fill="#BCA1F5">↗</text><text x="34" y="76" font-size="10" fill="#BCA1F5" class="mono">Storage / learning by building</text><text x="34" y="108" font-size="13" fill="#A0AEC5">A key-value store where I explore how storage works, from</text><text x="34" y="130" font-size="13" fill="#A0AEC5">memory-mapped files and concurrent indexing to zero-copy reads</text><text x="34" y="152" font-size="13" fill="#A0AEC5">with sendfile.</text><svg x="36" y="201" width="408" height="71" viewBox="0 0 380 66"><g fill="#201d34" stroke="#655389"><rect x="35" y="16" width="38" height="34" rx="4"/><rect x="81" y="16" width="38" height="34" rx="4"/><rect x="127" y="16" width="38" height="34" rx="4"/><rect x="173" y="16" width="38" height="34" rx="4"/><rect x="219" y="16" width="38" height="34" rx="4"/></g><rect class="pulse" x="127" y="16" width="38" height="34" rx="4" fill="#5b428a" stroke="#c3a5ff"/><path d="M268 33H339L333 28M339 33L333 38" stroke="#bca1f5" fill="none"/><text x="304" y="22" font-family="monospace" font-size="8" fill="#9984bd">sendfile</text></svg><text x="34" y="290" font-size="10" fill="#91A5C1" class="mono">Go / mmap / sendfile</text></svg>
