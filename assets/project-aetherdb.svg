<svg width="580" height="270" viewBox="0 0 580 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a-title a-desc">
  <title id="a-title">AetherDB — embedded mmap-backed key-value storage</title>
  <desc id="a-desc">Animated card: a GET traverses memory-mapped pages while a hot-page highlight cycles across them, then leaves through a zero-copy path.</desc>

  <defs>
    <linearGradient id="a-bg" x1="12" y1="10" x2="568" y2="262" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#101826"/>
    </linearGradient>
    <linearGradient id="a-wash" x1="0" y1="92" x2="0" y2="222" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00ADD8" stop-opacity=".07"/>
      <stop offset="1" stop-color="#00ADD8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="a-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8B949E" fill-opacity=".13"/>
    </pattern>
  </defs>

  <style>
    text[font-family] { font-family:"DejaVu Sans",Arial,sans-serif; }
    text { font-family:"DejaVu Sans Mono",Consolas,"Liberation Mono",monospace; }
    @media (prefers-reduced-motion: reduce) { animate,animateMotion,animateTransform { display:none; } circle:has(animateMotion) { visibility:hidden; } }
  </style>

  <rect width="580" height="270" fill="#0D1117"/>
  <path d="M22 1H558" stroke="#21262D"/>

  <!-- header -->
  <path d="M22 36H558" stroke="#21262D"/>
  <text x="22" y="24" fill="#00ADD8" font-size="11" font-weight="700">02</text>
  <text x="44" y="24" fill="#8B949E" font-size="10">/ aetherdb</text>
  <text x="468" y="24" text-anchor="end" fill="#6E7681" font-size="8.5" letter-spacing="1.2">STORAGE ENGINE</text>
  <circle cx="488" cy="20" r="3" fill="#3FB950">
    <animate attributeName="opacity" values=".45;1;.45" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="497" y="24" fill="#3FB950" font-size="9" letter-spacing="1">ONLINE</text>

  <!-- title -->
  <text x="22" y="62" fill="#F0F6FC" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700">AetherDB</text>
  <text x="22" y="80" fill="#8B949E" font-size="11">Embedded KV storage in Go — mmap-durable, lock-free CAS index, zero-copy GET.</text>

  <!-- band -->
  <rect x="12" y="92" width="556" height="130" rx="9" fill="#0B0F14" stroke="#21262D"/>
  <rect x="13" y="93" width="554" height="128" rx="8" fill="url(#a-dots)"/>
  <rect x="13" y="93" width="554" height="128" rx="8" fill="url(#a-wash)"/>
  <text x="26" y="106" fill="#6E7681" font-size="7.5" letter-spacing="1">MMAP PAGES · LOCK-FREE CAS INDEX</text>
  <text x="554" y="106" text-anchor="end" fill="#00ADD8" font-size="7.5" letter-spacing=".4">zero-copy GET</text>

  <!-- sendfile path -->
  <path d="M398 164H534" stroke="#21262D"/>
  <path d="M534 164L526 160V168Z" fill="#21262D"/>
  <circle opacity="0" r="3" fill="#00ADD8">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M400 164H528"/>
  <animate attributeName="opacity" values="1;1" dur="2s" begin="0s" repeatCount="indefinite"/></circle>

  <!-- get → pages -->
  <rect x="26" y="154" width="58" height="20" rx="6" fill="#0D1117" stroke="#00ADD8"/>
  <text x="55" y="167" text-anchor="middle" fill="#00ADD8" font-size="8.5" font-weight="700" letter-spacing=".7">GET k</text>
  <path d="M84 164H108" stroke="#30363D"/>

  <!-- pages -->
  <rect x="108" y="146" width="30" height="36" rx="4" fill="#0D1117" stroke="#30363D"/>
  <rect x="144" y="146" width="30" height="36" rx="4" fill="#0D1117" stroke="#30363D"/>
  <rect x="180" y="146" width="30" height="36" rx="4" fill="#0D1117" stroke="#30363D"/>
  <rect x="216" y="146" width="30" height="36" rx="4" fill="#0D1117" stroke="#30363D"/>
  <rect x="252" y="146" width="30" height="36" rx="4" fill="#0D1117" stroke="#30363D"/>
  <rect x="288" y="146" width="30" height="36" rx="4" fill="#0D1117" stroke="#30363D"/>
  <rect x="324" y="146" width="30" height="36" rx="4" fill="#0D1117" stroke="#30363D"/>
  <rect x="360" y="146" width="30" height="36" rx="4" fill="#0D1117" stroke="#30363D"/>

  <!-- hot page -->
  <rect x="108" y="146" width="30" height="36" rx="4" fill="#00ADD8" fill-opacity=".16" stroke="#00ADD8">
    <animate attributeName="x" values="108;144;180;216;252;288;324;360;108" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="5.6s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>

  <!-- footer -->
  <rect x="22" y="234" width="29" height="18" rx="9" stroke="#30363D"/>
  <text x="36.5" y="246" text-anchor="middle" fill="#8B949E" font-size="9">Go</text>
  <rect x="57" y="234" width="40" height="18" rx="9" stroke="#30363D"/>
  <text x="77" y="246" text-anchor="middle" fill="#8B949E" font-size="9">mmap</text>
  <rect x="103" y="234" width="88" height="18" rx="9" stroke="#30363D"/>
  <text x="147" y="246" text-anchor="middle" fill="#8B949E" font-size="9">lock-free CAS</text>
  <text x="554" y="246" text-anchor="end" fill="#00ADD8" font-size="10">repo →</text>
</svg>
