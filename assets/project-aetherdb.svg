<svg width="580" height="250" viewBox="0 0 580 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a-title a-desc">
  <title id="a-title">AetherDB</title>
  <desc id="a-desc">An embedded mmap-backed key-value storage engine written in Go.</desc>
  <defs><linearGradient id="a-bg" x1="10" y1="12" x2="565" y2="245" gradientUnits="userSpaceOnUse"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#121820"/></linearGradient></defs>
  <style>text{font-family:"DejaVu Sans Mono",Consolas,"Liberation Mono",monospace}@media(prefers-reduced-motion:reduce){animate,animateMotion{display:none}}</style>
  <rect width="580" height="250" fill="#0D1117"/>
  <rect x="1" width="578" height="250" fill="url(#a-bg)" stroke="#30363D" stroke-width="2"/>
  <path d="M1 38H579" stroke="#30363D"/>
  <text x="20" y="24" fill="#8B949E" font-size="11">02 / aether.db</text>
  <text x="558" y="24" text-anchor="end" fill="#3FB950" font-size="10">● MOUNTED</text>
  <text x="22" y="70" fill="#F0F6FC" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700">AetherDB</text>
  <text x="558" y="69" text-anchor="end" fill="#D29922" font-size="10">EMBEDDED KV ENGINE</text>

