      <text x="12" y="21" fill="#8B949E" font-size="9">KEY</text><text x="12" y="40" fill="#58A6FF" font-size="12">user:0042</text>
    </g>
    <path d="M98 33H168" stroke="#30363D" stroke-width="3"/><path d="M98 33H168" stroke="#58A6FF" stroke-width="1.5" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" values="24;0" dur="2s" repeatCount="indefinite"/></path>
    <g transform="translate(168 0)">
      <rect width="154" height="66" rx="10" fill="#161B22" stroke="#D29922"/>
      <text x="77" y="16" text-anchor="middle" fill="#D29922" font-size="9">MMAP PAGES</text>
      <g transform="translate(12 25)">
        <rect width="22" height="25" rx="3" fill="#D29922"/><rect x="27" width="22" height="25" rx="3" fill="#21262D" stroke="#D29922"/><rect x="54" width="22" height="25" rx="3" fill="#21262D" stroke="#D29922"/><rect x="81" width="22" height="25" rx="3" fill="#21262D" stroke="#D29922"/><rect x="108" width="22" height="25" rx="3" fill="#21262D" stroke="#D29922"/>
        <animateTransform attributeName="transform" type="translate" values="12 25;17 25;12 25" dur="3s" repeatCount="indefinite"/>
      </g>
    </g>
    <path d="M322 33H392" stroke="#30363D" stroke-width="3"/><path d="M322 33H392" stroke="#3FB950" stroke-width="1.5" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" values="24;0" dur="2s" repeatCount="indefinite"/></path>
    <g transform="translate(392 3)">
