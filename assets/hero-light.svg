<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Mersad Moghaddam — Backend Engineer and Go Developer</title>
  <desc id="desc">A calm technical banner with a terminal prompt, service nodes, data flow, and concurrent worker lanes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf4fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#007f9f"/>
      <stop offset="1" stop-color="#6d5bd0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a8bad0" stroke-width="1" opacity=".24"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#ccd8e6"/>
  <rect x="760" y="1" width="439" height="358" rx="27" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g transform="translate(54 44)">
      <rect width="620" height="50" rx="12" fill="#ffffff" stroke="#c8d6e5"/>
      <circle cx="22" cy="25" r="5" fill="#df536d"/>
      <circle cx="40" cy="25" r="5" fill="#d7a500"/>
      <circle cx="58" cy="25" r="5" fill="#238b62"/>
      <text x="86" y="32" fill="#5f7189" font-size="17">$</text>
      <text x="108" y="32" fill="#24354c" font-size="17">go run ./cmd/mersad</text>
      <rect x="300" y="17" width="10" height="20" rx="2" fill="#008eb2"/>
    </g>

    <text x="54" y="161" fill="#10233d" font-size="48" font-weight="700" letter-spacing="-1.2">Mersad Moghaddam</text>
    <rect x="54" y="184" width="92" height="4" rx="2" fill="url(#accent)"/>
    <text x="54" y="227" fill="#007f9f" font-size="24" font-weight="700">Backend Engineer</text>
    <text x="282" y="227" fill="#667b94" font-size="22">·</text>
    <text x="306" y="227" fill="#31445d" font-size="24">Go Developer</text>
    <text x="54" y="271" fill="#546b84" font-size="17">reliable systems  /  clear boundaries  /  observable by design</text>

    <g transform="translate(54 300)" font-size="13" font-weight="700">
      <rect width="128" height="30" rx="15" fill="#e5f6fa" stroke="#8cc9d8"/>
      <circle cx="18" cy="15" r="4" fill="#008eb2"/>
      <text x="31" y="20" fill="#15647a">MASHHAD · IR</text>
      <rect x="142" width="104" height="30" rx="15" fill="#f0edff" stroke="#bbb2e6"/>
      <circle cx="160" cy="15" r="4" fill="#6d5bd0"/>
      <text x="173" y="20" fill="#5645af">GO / API</text>
    </g>
  </g>

  <g transform="translate(780 50)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 111H128C148 111 148 66 168 66H239" stroke="#9aadc3" stroke-width="2"/>
