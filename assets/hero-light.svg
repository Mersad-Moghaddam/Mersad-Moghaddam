    <path d="M33 111h18m-9-9 9 9-9 9" stroke="#007f9f" stroke-width="2"/>
    <rect x="168" y="42" width="116" height="48" rx="12" fill="#ffffff" stroke="#8ca1b9"/>
    <rect x="168" y="132" width="116" height="48" rx="12" fill="#ffffff" stroke="#8ca1b9"/>
    <circle cx="188" cy="66" r="5" fill="#238b62" stroke="none"/>
