<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375" viewBox="0 0 1000 375" role="img" aria-labelledby="title desc">
<title id="title">ClipDeck — Your clipboard, with a memory.</title><desc id="desc">Your clipboard, with a memory. A clipboard manager for Linux that keeps what you copy searchable and within reach, with persistent history and a keyboard-first workflow. The terminal is a conceptual CLI illustration, not captured output.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'DejaVu Sans Mono',Consolas,monospace}.packet{animation:travel 4s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.cursor{animation:blink 1.2s steps(1) infinite}@keyframes travel{to{stroke-dashoffset:-100}}@keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1000" height="375" fill="#090D15"/><path d="M40 1H960" stroke="#26334B"/><text x="40" y="35" font-size="18" fill="#76DCC0" class="mono">./</text><text x="74" y="35" font-size="20" fill="#EDF3FC">Selected work</text><text x="615" y="35" font-size="11" fill="#7184A1">projects I’m building and learning from</text><rect x="40" y="62" width="920" height="295" rx="13" fill="#111B2D" stroke="#344361"/><defs><linearGradient id="accent"><stop stop-color="#F0BF7E"/><stop offset=".5" stop-color="#EE8D8D"/><stop offset="1" stop-color="#BCA1F5"/></linearGradient></defs><path d="M65 63H935" stroke="url(#accent)" stroke-width="2"/><text x="70" y="99" font-size="11" fill="#F0BF7E" class="mono">Featured project / Linux tools</text><text x="70" y="150" font-size="44" fill="#EDF3FC" font-weight="700">ClipDeck</text><text x="70" y="180" font-size="14" fill="#A0AEC5">Your clipboard, with a memory. A clipboard manager for</text><text x="70" y="203" font-size="14" fill="#A0AEC5">Linux that keeps what you copy searchable and within</text><text x="70" y="226" font-size="14" fill="#A0AEC5">reach, with persistent history and a keyboard-first</text><text x="70" y="249" font-size="14" fill="#A0AEC5">workflow.</text><rect x="70" y="285" width="35" height="23" rx="10" fill="#101827" stroke="#26354C"/><text x="79" y="301" font-size="10" fill="#A4B8D4" class="mono">Go</text><rect x="113" y="285" width="64" height="23" rx="10" fill="#101827" stroke="#26354C"/><text x="122" y="301" font-size="10" fill="#A4B8D4" class="mono">SQLite</text><rect x="185" y="285" width="45" height="23" rx="10" fill="#101827" stroke="#26354C"/><text x="194" y="301" font-size="10" fill="#A4B8D4" class="mono">QML</text><rect x="238" y="285" width="56" height="23" rx="10" fill="#101827" stroke="#26354C"/><text x="247" y="301" font-size="10" fill="#A4B8D4" class="mono">Linux</text><text x="70" y="335" font-size="13" fill="#EDC28A">Explore the project ↗</text><rect x="555" y="104" width="375" height="214" rx="9" fill="#0A111C" stroke="#32435C"/><path d="M555 135H930" stroke="#26334B"/><circle cx="568" cy="120" r="3" fill="#E58C91"/><circle cx="579" cy="120" r="3" fill="#E9C477"/><circle cx="590" cy="120" r="3" fill="#72D8B7"/><text x="604" y="124" font-size="10" fill="#8095B1" class="mono">conceptual CLI illustration</text><text x="574" y="163" font-size="12" fill="#7DDFC6" class="mono">➜ clipdeck search &quot;docker&quot;</text><text x="574" y="185" font-size="10" fill="#8299B7" class="mono">searching clipboard history…</text><rect x="570" y="198" width="342" height="28" rx="3" fill="#162839" stroke="#162839"/><text x="579" y="217" font-size="12" fill="#F1C58C" class="mono">❯ docker compose up -d</text><text x="589" y="246" font-size="11" fill="#9EAFC8" class="mono">docker logs --follow api</text><text x="589" y="269" font-size="11" fill="#9EAFC8" class="mono">docker exec -it db sh</text><text x="574" y="298" font-size="12" fill="#7DDFC6" class="mono">➜</text><rect class="cursor" x="594" y="287" width="7" height="13" fill="#76DCC0"/></svg>