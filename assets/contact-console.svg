  <defs>
    <linearGradient id="contact-bg" x1="20" y1="10" x2="1160" y2="165" gradientUnits="userSpaceOnUse"><stop stop-color="#0D1117"/><stop offset=".52" stop-color="#111B27"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
