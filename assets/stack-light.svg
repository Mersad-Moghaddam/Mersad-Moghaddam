<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Mersad Moghaddam systems toolbox</title>
  <desc id="desc">Go and Linux; MySQL, Redis, and Redis Streams; Docker, GitHub Actions, Prometheus, and Grafana; REST, SSE, and OpenAPI.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#008cad"/>
      <stop offset="1" stop-color="#6d5ee8"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#a9bed3" stroke-width="1" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="900" height="600" rx="28" fill="#f6f9fd"/>
  <rect x="1" y="1" width="898" height="598" rx="27" fill="none" stroke="#c6d5e5"/>
  <rect x="1" y="1" width="898" height="598" rx="27" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="42" y="52" fill="#007f9f" font-size="14" font-weight="700" letter-spacing="2">SYSTEMS TOOLBOX / VERIFIED FROM PUBLIC WORK</text>
    <rect x="42" y="70" width="816" height="3" rx="1.5" fill="url(#edge)"/>

    <g transform="translate(42 104)">
      <rect width="394" height="204" rx="18" fill="#ffffff" stroke="#c8d7e6"/>
      <text x="24" y="40" fill="#5b718a" font-size="13" font-weight="700" letter-spacing="1.5">01 / CORE BACKEND</text>
      <text x="24" y="79" fill="#182b43" font-size="28" font-weight="700">Go</text>
      <text x="95" y="79" fill="#8194aa" font-size="20">+</text>
      <text x="125" y="79" fill="#182b43" font-size="28" font-weight="700">Linux</text>
      <text x="24" y="112" fill="#526a84" font-size="15">concurrency · HTTP · kernel interfaces</text>
      <g transform="translate(24 138)" font-size="14" font-weight="700">
        <rect width="101" height="38" rx="19" fill="#e8f8fc" stroke="#5cb9ce"/>
        <circle cx="18" cy="19" r="5" fill="#008cad"/>
        <text x="32" y="24" fill="#075b70">GOROUTINES</text>
        <rect x="113" width="102" height="38" rx="19" fill="#f1f5fa" stroke="#b7c8d9"/>
        <text x="133" y="24" fill="#344d68">NETLINK</text>
        <rect x="227" width="126" height="38" rx="19" fill="#f1f5fa" stroke="#b7c8d9"/>
        <text x="247" y="24" fill="#344d68">PROC / SYS</text>
      </g>
    </g>

    <g transform="translate(464 104)">
      <rect width="394" height="204" rx="18" fill="#ffffff" stroke="#c8d7e6"/>
      <text x="24" y="40" fill="#5b718a" font-size="13" font-weight="700" letter-spacing="1.5">02 / DATA + MESSAGING</text>
      <text x="24" y="79" fill="#182b43" font-size="24" font-weight="700">MySQL</text>
      <text x="113" y="79" fill="#8194aa" font-size="20">·</text>
      <text x="140" y="79" fill="#182b43" font-size="24" font-weight="700">Redis</text>
      <text x="24" y="112" fill="#526a84" font-size="15">durability · caching · asynchronous flow</text>
      <g transform="translate(24 138)" font-size="14" font-weight="700">
        <rect width="105" height="38" rx="19" fill="#f0edff" stroke="#afa4ef"/>
        <circle cx="18" cy="19" r="5" fill="#6d5ee8"/>
        <text x="32" y="24" fill="#4737b3">STREAMS</text>
        <rect x="117" width="96" height="38" rx="19" fill="#f1f5fa" stroke="#b7c8d9"/>
        <text x="137" y="24" fill="#344d68">OUTBOX</text>
        <rect x="225" width="127" height="38" rx="19" fill="#f1f5fa" stroke="#b7c8d9"/>
        <text x="245" y="24" fill="#344d68">MIGRATIONS</text>
      </g>
    </g>

    <g transform="translate(42 328)">
      <rect width="394" height="230" rx="18" fill="#ffffff" stroke="#c8d7e6"/>
      <text x="24" y="40" fill="#5b718a" font-size="13" font-weight="700" letter-spacing="1.5">03 / DELIVERY + SIGNALS</text>
      <text x="24" y="76" fill="#182b43" font-size="21" font-weight="700">Docker · GitHub Actions</text>
      <text x="24" y="107" fill="#526a84" font-size="15">repeatable builds and automated delivery</text>
      <g transform="translate(24 129)" font-size="14" font-weight="700">
        <rect width="151" height="38" rx="19" fill="#e8f8fc" stroke="#5cb9ce"/>
        <circle cx="18" cy="19" r="5" fill="#008cad"/>
        <text x="32" y="24" fill="#075b70">PROMETHEUS</text>
        <rect x="163" width="104" height="38" rx="19" fill="#f0edff" stroke="#afa4ef"/>
        <circle cx="181" cy="19" r="5" fill="#6d5ee8"/>
        <text x="195" y="24" fill="#4737b3">GRAFANA</text>
      </g>
      <text x="24" y="199" fill="#617994" font-size="14">metrics · readiness · structured logs</text>
    </g>

    <g transform="translate(464 328)">
      <rect width="394" height="230" rx="18" fill="#ffffff" stroke="#c8d7e6"/>
      <text x="24" y="40" fill="#5b718a" font-size="13" font-weight="700" letter-spacing="1.5">04 / INTERFACES</text>
      <text x="24" y="76" fill="#182b43" font-size="21" font-weight="700">REST · SSE · OpenAPI</text>
      <text x="24" y="107" fill="#526a84" font-size="15">small contracts, observable behavior</text>
      <g transform="translate(24 129)" font-size="14" font-weight="700">
        <rect width="96" height="38" rx="19" fill="#f1f5fa" stroke="#b7c8d9"/>
        <text x="76" y="24" fill="#344d68" text-anchor="end">JSON</text>
        <rect x="108" width="96" height="38" rx="19" fill="#f1f5fa" stroke="#b7c8d9"/>
        <text x="184" y="24" fill="#344d68" text-anchor="end">YAML</text>
        <rect x="216" width="136" height="38" rx="19" fill="#f0edff" stroke="#afa4ef"/>
        <circle cx="234" cy="19" r="5" fill="#6d5ee8"/>
        <text x="248" y="24" fill="#4737b3">GRACEFUL</text>
      </g>
      <text x="24" y="199" fill="#617994" font-size="14">validation · timeouts · shutdown</text>
    </g>
  </g>
</svg>
