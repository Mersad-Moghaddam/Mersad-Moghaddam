<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mersad Moghaddam — Backend Engineer</title>
  <desc id="desc">A production control room inspired header showing reliable system nodes and a healthy status signal.</desc>

  <defs>
    <linearGradient id="bg" x1="48" y1="22" x2="1128" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.52" stop-color="#111A26"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="96" y1="74" x2="1030" y2="286" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.52" stop-color="#00ADD8"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(920 180) rotate(180) scale(310 250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00ADD8" stop-opacity=".13"/>
      <stop offset="1" stop-color="#00ADD8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#8B949E" stroke-opacity=".08"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) {
      animate { display: none; }
    }
  </style>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="18" fill="url(#glow)"/>
  <rect x=".75" y=".75" width="1198.5" height="358.5" rx="17.25" stroke="#30363D" stroke-width="1.5"/>

  <g font-family="DejaVu Sans Mono, Consolas, Liberation Mono, monospace">
    <g transform="translate(58 42)">
      <circle cx="7" cy="7" r="7" fill="#3FB950"/>
      <circle cx="7" cy="7" r="7" fill="#3FB950" opacity=".34" filter="url(#softGlow)">
        <animate attributeName="r" values="7;15;7" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".34;0;.34" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="25" y="12" fill="#8B949E" font-size="15" letter-spacing="1">SYSTEM STATUS</text>
      <text x="206" y="12" fill="#3FB950" font-size="15" font-weight="700" letter-spacing="1">OPERATIONAL</text>
    </g>

    <text x="58" y="143" fill="#F0F6FC" font-family="DejaVu Sans, Arial, sans-serif" font-size="52" font-weight="700">MERSAD MOGHADDAM</text>
    <rect x="58" y="164" width="574" height="4" rx="2" fill="url(#accent)"/>
    <text x="58" y="211" fill="#C9D1D9" font-size="19" letter-spacing="1.5">BACKEND ENGINEER  /  GO DEVELOPER</text>
    <text x="58" y="252" fill="#8B949E" font-size="18">Designing systems that fail clearly, recover deliberately,</text>
    <text x="58" y="280" fill="#8B949E" font-size="18">and stay boring in production.</text>

    <g transform="translate(58 310)" font-size="13" letter-spacing="1">
      <text fill="#58A6FF">CORRECTNESS</text>
      <text x="124" fill="#484F58">/</text>
      <text x="148" fill="#00ADD8">CONCURRENCY</text>
      <text x="274" fill="#484F58">/</text>
      <text x="298" fill="#3FB950">OBSERVABILITY</text>
    </g>

    <g transform="translate(760 62)">
      <rect x="0" y="0" width="382" height="236" rx="12" fill="#0D1117" fill-opacity=".7" stroke="#30363D"/>
      <circle cx="22" cy="21" r="4" fill="#FF5F56"/>
      <circle cx="36" cy="21" r="4" fill="#FFBD2E"/>
      <circle cx="50" cy="21" r="4" fill="#3FB950"/>
      <text x="190" y="25" text-anchor="middle" fill="#8B949E" font-size="11">production.map</text>

      <g stroke-width="1.5">
        <path d="M191 87L102 140M191 87L280 140M102 140L191 193M280 140L191 193" stroke="#30363D"/>
        <path d="M191 87L280 140" stroke="#00ADD8" stroke-dasharray="5 7">
          <animate attributeName="stroke-dashoffset" values="24;0" dur="2.4s" repeatCount="indefinite"/>
        </path>
        <path d="M102 140L191 193" stroke="#3FB950" stroke-dasharray="5 7">
          <animate attributeName="stroke-dashoffset" values="24;0" dur="2.8s" repeatCount="indefinite"/>
        </path>
      </g>

      <g font-size="11" text-anchor="middle">
        <g transform="translate(191 87)">
          <circle r="27" fill="#161B22" stroke="#58A6FF" stroke-width="1.5"/>
          <text y="4" fill="#58A6FF">API</text>
        </g>
        <g transform="translate(102 140)">
          <circle r="27" fill="#161B22" stroke="#00ADD8" stroke-width="1.5"/>
          <text y="4" fill="#00ADD8">QUEUE</text>
        </g>
        <g transform="translate(280 140)">
          <circle r="27" fill="#161B22" stroke="#D29922" stroke-width="1.5"/>
          <text y="4" fill="#D29922">STORE</text>
        </g>
        <g transform="translate(191 193)">
          <circle r="27" fill="#161B22" stroke="#3FB950" stroke-width="1.5"/>
          <text y="4" fill="#3FB950">SIGNAL</text>
        </g>
      </g>

      <text x="18" y="222" fill="#3FB950" font-size="11">● healthy</text>
      <text x="300" y="222" fill="#8B949E" font-size="11">p99 142ms</text>
    </g>
  </g>
</svg>
