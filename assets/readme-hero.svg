<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Mersad Moghaddam — Go Backend and Systems Engineer</title>
  <desc id="hero-desc">Profile manifest for Mersad Moghaddam, a backend and systems engineer from Mashhad focused on Go, Linux, distributed systems, storage, APIs, command-line tools, monitoring, bounded concurrency, and useful telemetry.</desc>

  <defs>
    <linearGradient id="hero-bg" x1="18" y1="14" x2="1170" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset=".58" stop-color="#111A25"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="hero-accent" x1="48" y1="0" x2="1128" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset=".52" stop-color="#00ADD8"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
    <pattern id="hero-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#8B949E" stroke-opacity=".055"/>
    </pattern>
    <filter id="hero-glow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <style>
    text { font-family:"DejaVu Sans Mono",Consolas,"Liberation Mono",monospace; }
    @media (prefers-reduced-motion: reduce) { animate { display:none; } }
  </style>

  <rect width="1200" height="400" fill="#0D1117"/>
  <path d="M16 1H1184Q1199 1 1199 16V399H1V16Q1 1 16 1Z" fill="url(#hero-bg)" stroke="#30363D" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="398" rx="16" fill="url(#hero-grid)"/>
  <path d="M1 43H1199" stroke="#30363D"/>

  <!-- terminal chrome -->
  <circle cx="22" cy="22" r="6" fill="#FF5F56"/>
  <circle cx="42" cy="22" r="6" fill="#FFBD2E"/>
  <circle cx="62" cy="22" r="6" fill="#3FB950"/>
  <text x="600" y="27" text-anchor="middle" fill="#8B949E" font-size="12">profile.bootstrap · mersad@github</text>
  <circle cx="1092" cy="22" r="5" fill="#3FB950">
    <animate attributeName="opacity" values=".45;1;.45" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="1105" y="26" fill="#3FB950" font-size="10">PROFILE ONLINE</text>

  <!-- identity -->
  <g transform="translate(48 68)">
    <rect width="118" height="28" rx="14" fill="#00ADD8" stroke="#00ADD8"/>
    <text x="59" y="19" text-anchor="middle" fill="#0D1117" font-size="11" font-weight="700">HELLO / SALAM</text>

    <text x="0" y="91" fill="#F0F6FC" font-family="DejaVu Sans,Arial,sans-serif" font-size="51" font-weight="700">MERSAD MOGHADDAM</text>
    <rect x="0" y="111" width="585" height="3" rx="1.5" fill="url(#hero-accent)"/>
    <text x="0" y="153" fill="#58A6FF" font-size="18" letter-spacing="1.2">GO BACKEND &amp; SYSTEMS ENGINEER</text>

    <text x="0" y="198" fill="#C9D1D9" font-size="14">I build concurrent services, Linux-native tools, storage engines,</text>
    <text x="0" y="223" fill="#C9D1D9" font-size="14">and observable backends designed to stay understandable.</text>

    <g transform="translate(0 257)">
      <text x="0" y="12" fill="#8B949E" font-size="10">BASED IN</text>
      <text x="78" y="12" fill="#F0F6FC" font-size="12">Mashhad, Iran</text>
      <text x="226" y="12" fill="#484F58" font-size="12">·</text>
      <text x="246" y="12" fill="#8B949E" font-size="10">MODE</text>
      <text x="292" y="12" fill="#3FB950" font-size="12">building / learning / open source</text>
    </g>

    <g transform="translate(0 299)">
      <text x="0" y="13" fill="#3FB950" font-size="13">$</text>
      <text x="19" y="13" fill="#8B949E" font-size="12">intent</text>
      <text x="76" y="13" fill="#00ADD8" font-size="12">make complex systems easier to reason about</text>
      <rect x="470" y="1" width="8" height="14" rx="1" fill="#00ADD8">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.46;.47;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- concise but complete profile manifest -->
  <g transform="translate(735 64)">
    <rect width="415" height="310" rx="12" fill="#0D1117" stroke="#30363D"/>
    <path d="M0 35H415" stroke="#21262D"/>
    <text x="18" y="23" fill="#8B949E" font-size="10">profile.manifest</text>
    <text x="397" y="23" text-anchor="end" fill="#58A6FF" font-size="9">READ-ONLY</text>

    <g transform="translate(18 57)">
      <text x="0" y="0" fill="#8B949E" font-size="9">ROLE</text>
      <text x="98" y="0" fill="#F0F6FC" font-size="11">Backend / Systems Engineer</text>
      <path d="M0 17H379" stroke="#21262D"/>

      <text x="0" y="42" fill="#8B949E" font-size="9">PRIMARY</text>
      <text x="98" y="42" fill="#00ADD8" font-size="11">Go</text>
      <path d="M0 59H379" stroke="#21262D"/>

      <text x="0" y="84" fill="#8B949E" font-size="9">FOCUS</text>
      <text x="98" y="84" fill="#C9D1D9" font-size="10">Linux · Distributed Systems · Storage</text>
      <path d="M0 101H379" stroke="#21262D"/>

      <text x="0" y="126" fill="#8B949E" font-size="9">BUILDS</text>
      <text x="98" y="126" fill="#C9D1D9" font-size="10">APIs · CLIs · Monitoring · Data Systems</text>
      <path d="M0 143H379" stroke="#21262D"/>

      <text x="0" y="168" fill="#8B949E" font-size="9">PROJECTS</text>
      <text x="98" y="168" fill="#58A6FF" font-size="10">SysKit · AetherDB · Argus · Whisper</text>
      <path d="M0 185H379" stroke="#21262D"/>

      <text x="0" y="210" fill="#8B949E" font-size="9">DEFAULTS</text>
      <text x="98" y="210" fill="#3FB950" font-size="10">Bounded work · Clear failures · Useful signals</text>
    </g>

    <rect x="18" y="283" width="379" height="2" rx="1" fill="url(#hero-accent)"/>
    <text x="18" y="301" fill="#8B949E" font-size="9">complexity in</text>
    <text x="207" y="301" text-anchor="middle" fill="#00ADD8" font-size="10">COMPILE WITH CARE</text>
    <text x="397" y="301" text-anchor="end" fill="#3FB950" font-size="9">clarity out</text>
  </g>
</svg>
