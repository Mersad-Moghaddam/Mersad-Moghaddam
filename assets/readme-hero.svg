<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475" viewBox="0 0 1000 475" role="img" aria-labelledby="title desc">
<title id="title">Mersad Moghaddam — Software developer</title><desc id="desc">I like building useful software. I work mostly with Go, developing backend services and tools for Linux. I enjoy understanding how things work and turning that understanding into software that solves practical problems.</desc>
