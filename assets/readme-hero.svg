<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Mersad Moghaddam — Go Backend Engineer</title>
  <desc id="hero-desc">A terminal-inspired profile header with an animated circuit monogram transforming complexity into clarity.</desc>

  <defs>
    <linearGradient id="hero-bg" x1="18" y1="14" x2="1170" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset=".58" stop-color="#111A25"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="hero-accent" x1="54" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset=".52" stop-color="#00ADD8"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
    <linearGradient id="monogram-line" x1="60" y1="150" x2="342" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset=".5" stop-color="#00ADD8"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
    <radialGradient id="hero-glow" cx="0" cy="0" r="1" gradientTransform="translate(944 175) rotate(90) scale(160 250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00ADD8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#00ADD8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#8B949E" stroke-opacity=".055"/>
    </pattern>
    <filter id="packet-glow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <style>
    text { font-family:"DejaVu Sans Mono",Consolas,"Liberation Mono",monospace; }
    @media (prefers-reduced-motion: reduce) {
      animate, animateMotion { display:none; }
      .packet { display:none; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="328" rx="16" fill="url(#hero-bg)" stroke="#30363D" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="328" rx="16" fill="url(#hero-grid)"/>
  <rect x="1" y="1" width="1198" height="328" rx="16" fill="url(#hero-glow)"/>
  <path d="M1 43H1199" stroke="#30363D"/>

  <!-- shared terminal chrome -->
  <circle cx="22" cy="22" r="6" fill="#FF5F56"/>
  <circle cx="42" cy="22" r="6" fill="#FFBD2E"/>
  <circle cx="62" cy="22" r="6" fill="#3FB950"/>
  <text x="600" y="27" text-anchor="middle" fill="#8B949E" font-size="12">profile.bootstrap · mersad@github</text>
  <text x="1168" y="27" text-anchor="end" fill="#58A6FF" font-size="10">GO / BACKEND</text>

  <!-- identity: intentionally concise; details live in the next console -->
  <g transform="translate(48 68)">
    <rect width="118" height="28" rx="14" fill="#00ADD8" stroke="#00ADD8"/>
    <text x="59" y="19" text-anchor="middle" fill="#0D1117" font-size="11" font-weight="700">HELLO / SALAM</text>

    <text x="0" y="91" fill="#F0F6FC" font-family="DejaVu Sans,Arial,sans-serif" font-size="52" font-weight="700">MERSAD MOGHADDAM</text>
    <rect x="0" y="111" width="585" height="3" rx="1.5" fill="url(#hero-accent)"/>
    <text x="0" y="153" fill="#58A6FF" font-size="18" letter-spacing="1.4">GO BACKEND ENGINEER</text>
    <text x="0" y="194" fill="#C9D1D9" font-size="16">Making complex systems easier to reason about.</text>

    <g transform="translate(0 226)">
      <text x="0" y="13" fill="#3FB950" font-size="13">$</text>
      <text x="19" y="13" fill="#8B949E" font-size="13">from</text>
      <text x="60" y="13" fill="#C9D1D9" font-size="13">Mashhad, IR</text>
      <rect x="159" y="1" width="8" height="14" rx="1" fill="#00ADD8">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.46;.47;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- signature circuit: complexity compiled into clarity -->
  <g transform="translate(735 64)">
    <rect width="415" height="238" rx="12" fill="#0D1117" stroke="#30363D"/>
    <path d="M0 35H415" stroke="#21262D"/>
    <text x="18" y="23" fill="#8B949E" font-size="10">signature.compiler</text>
    <circle cx="377" cy="18" r="4" fill="#3FB950"/>
    <text x="389" y="22" fill="#3FB950" font-size="9">READY</text>

    <!-- the M is both monogram and data path -->
    <path d="M62 157L111 70L176 139L241 70L290 157" stroke="#30363D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M62 157L111 70L176 139L241 70L290 157" stroke="url(#monogram-line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 9">
      <animate attributeName="stroke-dashoffset" values="36;0" dur="3s" repeatCount="indefinite"/>
    </path>

    <g class="packet">
      <circle r="4" fill="#58A6FF">
        <animateMotion path="M62 157L111 70L176 139L241 70L290 157" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="8" fill="#58A6FF" opacity=".22" filter="url(#packet-glow)">
        <animateMotion path="M62 157L111 70L176 139L241 70L290 157" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="4" fill="#3FB950">
        <animateMotion path="M62 157L111 70L176 139L241 70L290 157" begin="-1.7s" dur="3.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g>
      <circle cx="62" cy="157" r="8" fill="#0D1117" stroke="#58A6FF" stroke-width="2"/>
      <circle cx="111" cy="70" r="8" fill="#0D1117" stroke="#58A6FF" stroke-width="2"/>
      <circle cx="176" cy="139" r="12" fill="#0D1117" stroke="#00ADD8" stroke-width="2"/>
      <text x="176" y="143" text-anchor="middle" fill="#00ADD8" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="700">Go</text>
      <circle cx="241" cy="70" r="8" fill="#0D1117" stroke="#00ADD8" stroke-width="2"/>
      <circle cx="290" cy="157" r="8" fill="#0D1117" stroke="#3FB950" stroke-width="2"/>
    </g>

    <path d="M30 185H385" stroke="#21262D"/>
    <text x="30" y="210" fill="#8B949E" font-size="9">INPUT</text>
    <text x="75" y="210" fill="#F85149" font-size="11">COMPLEXITY</text>
    <path d="M178 206H235" stroke="#484F58" stroke-dasharray="3 4"/>
    <path d="M229 201L236 206L229 211" stroke="#484F58" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="258" y="210" fill="#8B949E" font-size="9">OUTPUT</text>
    <text x="309" y="210" fill="#3FB950" font-size="11">CLARITY</text>
  </g>
</svg>
