<svg width="580" height="250" viewBox="0 0 580 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ar-title ar-desc">
  <title id="ar-title">Argus</title>
  <desc id="ar-desc">A distributed uptime monitor with queued probes and live operational signals.</desc>
  <defs><linearGradient id="ar-bg" x1="12" y1="10" x2="565" y2="245" gradientUnits="userSpaceOnUse"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#101A1A"/></linearGradient></defs>
  <style>text{font-family:"DejaVu Sans Mono",Consolas,"Liberation Mono",monospace}@media(prefers-reduced-motion:reduce){animate{display:none}}</style>
  <rect width="580" height="250" fill="#0D1117"/>
  <rect x="1" width="578" height="250" fill="url(#ar-bg)" stroke="#30363D" stroke-width="2"/>
  <path d="M1 38H579" stroke="#30363D"/>
  <text x="20" y="24" fill="#8B949E" font-size="11">03 / argus.monitor</text>
  <text x="558" y="24" text-anchor="end" fill="#3FB950" font-size="10">● WATCHING</text>
  <text x="22" y="70" fill="#F0F6FC" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700">Argus</text>
  <text x="558" y="69" text-anchor="end" fill="#3FB950" font-size="10">DISTRIBUTED UPTIME</text>

  <g transform="translate(24 91)">
    <g transform="translate(0 5)">
      <circle cx="31" cy="28" r="27" fill="#161B22" stroke="#58A6FF"/>
      <path d="M18 28H24L29 17L36 39L42 28H47" stroke="#58A6FF" stroke-width="2" stroke-linejoin="round"/>
      <text x="31" y="65" text-anchor="middle" fill="#58A6FF" font-size="8">PROBE</text>
    </g>
    <path d="M62 33H147" stroke="#30363D" stroke-width="3"/>
    <g transform="translate(147 4)">
      <rect width="74" height="58" rx="9" fill="#161B22" stroke="#D29922"/>
      <rect x="13" y="14" width="48" height="6" rx="3" fill="#D29922"/><rect x="13" y="26" width="39" height="6" rx="3" fill="#D29922"/><rect x="13" y="38" width="45" height="6" rx="3" fill="#D29922"/>
      <text x="37" y="69" text-anchor="middle" fill="#D29922" font-size="8">QUEUE</text>
    </g>
    <path d="M221 33H307" stroke="#30363D" stroke-width="3"/>
    <g transform="translate(307 3)">
      <rect width="76" height="60" rx="10" fill="#161B22" stroke="#00ADD8"/>
      <circle cx="24" cy="25" r="10" fill="#0D1117" stroke="#00ADD8"/><circle cx="51" cy="25" r="10" fill="#0D1117" stroke="#00ADD8"/>
      <text x="24" y="29" text-anchor="middle" fill="#00ADD8" font-size="8">go</text><text x="51" y="29" text-anchor="middle" fill="#00ADD8" font-size="8">go</text>
      <text x="38" y="51" text-anchor="middle" fill="#00ADD8" font-size="8">WORKERS</text>
    </g>
    <path d="M383 33H444" stroke="#30363D" stroke-width="3"/>
    <g transform="translate(444 5)">
      <rect width="65" height="56" rx="9" fill="#161B22" stroke="#3FB950"/>
      <path d="M9 32H17L22 19L29 42L36 13L43 32H56" stroke="#3FB950" stroke-width="2" stroke-linejoin="round">
        <animate attributeName="stroke-dasharray" values="0 140;140 0;0 140" dur="3s" repeatCount="indefinite"/>
      </path>
      <text x="33" y="50" text-anchor="middle" fill="#3FB950" font-size="8">SIGNAL</text>
    </g>
  </g>
  <path d="M22 183H558" stroke="#21262D"/>
  <text x="22" y="208" fill="#C9D1D9" font-size="11">probe quietly · alert only when it matters</text>
  <text x="22" y="230" fill="#00ADD8" font-size="10">Go</text><text x="49" y="230" fill="#484F58">·</text><text x="62" y="230" fill="#D29922" font-size="10">Asynq</text><text x="104" y="230" fill="#484F58">·</text><text x="117" y="230" fill="#F85149" font-size="10">Redis</text>
  <text x="558" y="230" text-anchor="end" fill="#8B949E" font-size="10">open repository ↗</text>
</svg>
