<svg xmlns="http://www.w3.org/2000/svg" width="500" height="320" viewBox="0 0 500 320" role="img" aria-labelledby="title desc">
<title id="title">Argus</title><desc id="desc">A self-hosted monitoring tool for websites and services, with availability, keyword, heartbeat, and TLS checks to help track failures and incidents.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'DejaVu Sans Mono',Consolas,monospace}.pulse{animation:pulse 2.4s ease-in-out infinite}svg > svg > path{stroke-dasharray:240 30;animation:flow 3.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-270}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
