<svg xmlns="http://www.w3.org/2000/svg" width="500" height="680" viewBox="0 0 500 680" role="img" aria-labelledby="title desc">
<title id="title">ClipDeck — Your clipboard, with a memory.</title><desc id="desc">Your clipboard, with a memory. A clipboard manager for Linux that keeps what you copy searchable and within reach, with persistent history and a keyboard-first workflow. Conceptual CLI illustration.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'DejaVu Sans Mono',Consolas,monospace}.packet{animation:travel 4s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.cursor{animation:blink 1.2s steps(1) infinite}@keyframes travel{to{stroke-dashoffset:-100}}@keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
