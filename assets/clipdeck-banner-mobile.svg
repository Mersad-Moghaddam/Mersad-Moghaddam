quot;docker&quot;</text><text x="574" y="185" font-size="10" fill="#8299B7" class="mono">searching clipboard history…</text><rect x="570" y="198" width="342" height="28" rx="3" fill="#162839" stroke="#162839"/><text x="579" y="217" font-size="12" fill="#F1C58C" class="mono">❯ docker compose up -d</text><text x="589" y="246" font-size="11" fill="#9EAFC8" class="mono">docker logs --follow api</text><text x="589" y="269" font-size="11" fill="#9EAFC8" class="mono">docker exec -it db sh</text><text x="574" y="298" font-size="12" fill="#7DDFC6" class="mono">➜</text><rect class="cursor" x="594" y="287" width="7" height="13" fill="#76DCC0"/></g><text x="36" y="633" font-size="14" fill="#EDC28A">Explore the project ↗</text></svg>