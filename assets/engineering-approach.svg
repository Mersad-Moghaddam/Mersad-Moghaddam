<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="315" viewBox="0 0 1000 315" role="img" aria-labelledby="title desc">
<title id="title">How I work — Keep it simple. Keep learning.</title><desc id="desc">Understand the problem. I like figuring out how things work before changing them. Reading the code and tracing the behavior help me choose what to build or fix. Make deliberate choices. I aim for code that is easy to follow, with clear responsibilities and sensible limits. Extra complexity should have a reason to be there. Learn through building. These projects are a way to solve useful problems and deepen my understanding. I test ideas, look at the results, and improve as I learn.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'DejaVu Sans Mono',Consolas,monospace}.packet{animation:travel 4s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.cursor{animation:blink 1.2s steps(1) infinite}@keyframes travel{to{stroke-dashoffset:-100}}@keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1000" height="315" fill="#090D15"/><path d="M40 20H960" stroke="#26334B"/><text x="40" y="61" font-size="18" fill="#76DCC0" class="mono">&gt;_</text><text x="78" y="61" font-size="20" fill="#EDF3FC">How I work</text><text x="670" y="61" font-size="11" fill="#8FA3BE" class="mono">keep it simple. keep learning.</text><path d="M40 90H330" stroke="#26334B"/><text x="40" y="126" font-size="23" fill="#85AFFF" class="mono">⌁</text><text x="40" y="161" font-size="17" fill="#EDF3FC" font-weight="700">Understand the problem.</text><text x="40" y="189" font-size="13" fill="#A0AEC5">I like figuring out how things work before</text><text x="40" y="211" font-size="13" fill="#A0AEC5">changing them. Reading the code and tracing</text><text x="40" y="233" font-size="13" fill="#A0AEC5">the behavior help me choose what to build</text><text x="40" y="255" font-size="13" fill="#A0AEC5">or fix.</text><path d="M355 90H645" stroke="#26334B"/><text x="355" y="126" font-size="23" fill="#BCA1F5" class="mono">[ ]</text><text x="355" y="161" font-size="17" fill="#EDF3FC" font-weight="700">Make deliberate choices.</text><text x="355" y="189" font-size="13" fill="#A0AEC5">I aim for code that is easy to follow, with</text><text x="355" y="211" font-size="13" fill="#A0AEC5">clear responsibilities and sensible limits.</text><text x="355" y="233" font-size="13" fill="#A0AEC5">Extra complexity should have a reason to be</text><text x="355" y="255" font-size="13" fill="#A0AEC5">there.</text><path d="M670 90H960" stroke="#26334B"/><text x="670" y="126" font-size="23" fill="#76DCC0" class="mono">↗</text><text x="670" y="161" font-size="17" fill="#EDF3FC" font-weight="700">Learn through building.</text><text x="670" y="189" font-size="13" fill="#A0AEC5">These projects are a way to solve useful</text><text x="670" y="211" font-size="13" fill="#A0AEC5">problems and deepen my understanding. I</text><text x="670" y="233" font-size="13" fill="#A0AEC5">test ideas, look at the results, and</text><text x="670" y="255" font-size="13" fill="#A0AEC5">improve as I learn.</text></svg>