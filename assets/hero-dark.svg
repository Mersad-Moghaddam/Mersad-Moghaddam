<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Mersad Moghaddam — Backend Engineer and Go Developer</title>
  <desc id="desc">A calm technical banner with a terminal prompt, service nodes, data flow, and concurrent worker lanes.</desc>
  <defs>
