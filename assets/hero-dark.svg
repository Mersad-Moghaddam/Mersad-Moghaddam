      <stop offset="0" stop-color="#00add8"/>
      <stop offset="1" stop-color="#8b7cf6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2b3a55" stroke-width="1" opacity=".22"/>
