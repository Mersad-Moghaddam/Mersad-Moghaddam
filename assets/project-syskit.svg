<svg width="580" height="250" viewBox="0 0 580 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s-title s-desc">
  <title id="s-title">SysKit</title>
  <desc id="s-desc">A fast, read-only, Linux-first system inspection and resource monitoring CLI built with Go.</desc>
  <defs>
    <linearGradient id="s-bg" x1="12" y1="10" x2="565" y2="245" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#101B20"/>
    </linearGradient>
    <linearGradient id="s-wire" x1="126" y1="0" x2="452" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D29922"/>
      <stop offset=".5" stop-color="#00ADD8"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family:"DejaVu Sans Mono",Consolas,"Liberation Mono",monospace; }
    @media (prefers-reduced-motion: reduce) { animate,animateMotion { display:none; } }
  </style>

  <rect width="580" height="250" fill="#0D1117"/>
  <rect x="1" y="1" width="578" height="248" rx="14" fill="url(#s-bg)" stroke="#30363D" stroke-width="2"/>
  <path d="M1 38H579" stroke="#30363D"/>
  <circle cx="20" cy="19" r="5" fill="#FF5F56"/>
  <circle cx="37" cy="19" r="5" fill="#FFBD2E"/>
  <circle cx="54" cy="19" r="5" fill="#3FB950"/>
  <text x="290" y="24" text-anchor="middle" fill="#8B949E" font-size="11">04 / sys.kit</text>
  <text x="558" y="24" text-anchor="end" fill="#3FB950" font-size="10">● READ-ONLY</text>

  <text x="22" y="70" fill="#F0F6FC" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700">SysKit</text>
  <text x="558" y="69" text-anchor="end" fill="#00ADD8" font-size="10">NATIVE LINUX INTELLIGENCE</text>

  <g transform="translate(24 88)">
    <path d="M112 36H201M319 36H408" stroke="#30363D" stroke-width="3" stroke-linecap="round"/>
    <path d="M112 36H201M319 36H408" stroke="url(#s-wire)" stroke-width="1.5" stroke-dasharray="5 7">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="2.2s" repeatCount="indefinite"/>
    </path>

    <!-- direct Linux kernel sources -->
    <g transform="translate(0 0)">
      <rect width="112" height="72" rx="9" fill="#161B22" stroke="#D29922"/>
      <text x="12" y="18" fill="#8B949E" font-size="8">KERNEL</text>
      <text x="12" y="36" fill="#D29922" font-size="10">/proc  /sys</text>
      <text x="12" y="52" fill="#D29922" font-size="10">netlink</text>
      <text x="12" y="66" fill="#8B949E" font-size="8">cgroups</text>
    </g>

    <!-- static Go binary -->
    <g transform="translate(201 -3)">
      <rect width="118" height="78" rx="11" fill="#161B22" stroke="#00ADD8" stroke-width="1.5"/>
      <circle cx="59" cy="28" r="19" fill="#0D1117" stroke="#00ADD8"/>
      <text x="59" y="34" text-anchor="middle" fill="#00ADD8" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700">Go</text>
      <text x="59" y="60" text-anchor="middle" fill="#F0F6FC" font-size="10">SYSKIT</text>
      <text x="59" y="72" text-anchor="middle" fill="#8B949E" font-size="7">ZERO SHELL-OUTS</text>
    </g>

    <!-- stable outputs -->
    <g transform="translate(408 0)">
      <rect width="122" height="72" rx="9" fill="#161B22" stroke="#3FB950"/>
      <path d="M13 18H49M13 29H43M13 40H47" stroke="#3FB950" stroke-width="2" stroke-linecap="round"/>
      <path d="M69 14V45M69 45H109M73 39L82 31L91 35L104 20" stroke="#58A6FF" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="104" cy="20" r="3" fill="#58A6FF">
        <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="61" y="62" text-anchor="middle" fill="#3FB950" font-size="8">TABLE · JSON · TUI</text>
    </g>
  </g>

  <path d="M22 183H558" stroke="#21262D"/>
  <text x="22" y="208" fill="#C9D1D9" font-size="11">inspect live Linux state · change nothing</text>
  <text x="22" y="230" fill="#00ADD8" font-size="10">Go</text>
  <text x="49" y="230" fill="#484F58">·</text>
  <text x="62" y="230" fill="#D29922" font-size="10">Linux</text>
  <text x="104" y="230" fill="#484F58">·</text>
  <text x="117" y="230" fill="#58A6FF" font-size="10">Netlink</text>
  <text x="558" y="230" text-anchor="end" fill="#8B949E" font-size="10">open repository ↗</text>
</svg>
