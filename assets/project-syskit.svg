<svg xmlns="http://www.w3.org/2000/svg" width="500" height="320" viewBox="0 0 500 320" role="img" aria-labelledby="title desc">
<title id="title">SysKit</title><desc id="desc">A read-only terminal tool for exploring Linux system information. It reads from /proc, /sys, and Netlink directly, without relying on external shell commands.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'DejaVu Sans Mono',Consolas,monospace}.packet{animation:travel 4s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.cursor{animation:blink 1.2s steps(1) infinite}@keyframes travel{to{stroke-dashoffset:-100}}@keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="500" height="320" fill="#090D15"/><rect x="10" y="9" width="480" height="300" rx="10" fill="#101827" stroke="#26354C"/><path d="M11 28V290" stroke="#76DCC0" stroke-width="2"/><text x="34" y="50" font-size="25" fill="#EDF3FC" font-weight="700">SysKit</text><text x="447" y="49" font-size="22" fill="#76DCC0">↗</text><text x="34" y="76" font-size="10" fill="#76DCC0" class="mono">Linux tooling / system information</text><text x="34" y="108" font-size="13" fill="#A0AEC5">A read-only terminal tool for exploring Linux system</text><text x="34" y="130" font-size="13" fill="#A0AEC5">information. It reads from /proc, /sys, and Netlink directly,</text><text x="34" y="152" font-size="13" fill="#A0AEC5">without relying on external shell commands.</text><svg x="36" y="201" width="408" height="71" viewBox="0 0 380 66"><g fill="#20333d"><rect x="62" y="16" width="185" height="6" rx="3"/><rect x="62" y="30" width="185" height="6" rx="3"/><rect x="62" y="44" width="185" height="6" rx="3"/></g><g font-family="monospace" font-size="8" fill="#7ba99f"><text x="22" y="22">cpu</text><text x="22" y="36">mem</text><text x="22" y="50">io</text></g><rect x="62" y="16" width="97" height="6" rx="3" fill="#76dcc0"/><rect x="62" y="30" width="133" height="6" rx="3" fill="#85afff"/><rect x="62" y="44" width="57" height="6" rx="3" fill="#bca1f5"/><text x="275" y="36" font-family="monospace" font-size="10" fill="#76dcc0">read-only</text></svg><text x="34" y="290" font-size="10" fill="#91A5C1" class="mono">Go / procfs / Netlink</text></svg>