name: Generate contribution arcade

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-arcade-${{ github.repository }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate custom light and dark arcade SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/arcade-snake-light.svg?color_snake=#7c3aed&color_dots=#f6f8fa,#dbeafe,#93c5fd,#38bdf8,#0284c7
            dist/arcade-snake-dark.svg?color_snake=#22d3ee&color_dots=#0d1117,#172033,#233453,#5b5bd6,#a78bfa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch public GitHub signal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: |
          gh api graphql \
            -f login="$PROFILE_LOGIN" \
            -f query='
              query($login: String!) {
                user(login: $login) {
                  repositories(first: 100, ownerAffiliations: OWNER, privacy: PUBLIC) {
                    totalCount
                    nodes {
                      stargazerCount
                    }
                  }
                  contributionsCollection {
                    restrictedContributionsCount
                    totalCommitContributions
                    totalIssueContributions
                    totalPullRequestContributions
                    totalPullRequestReviewContributions
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          contributionCount
                          date
                        }
                      }
                    }
                  }
                }
              }
            ' > profile-stats.json

      - name: Render light and dark GitHub signal cards
        run: |
          node .github/scripts/render-profile-stats.mjs \
            profile-stats.json \
            dist/github-signal-light.svg \
            dist/github-signal-dark.svg

      - name: Publish to output branch
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          branch: output
          folder: dist
          clean: true
          force: false
          commit-message: "chore(profile): refresh contribution arcade"
