<svg viewBox="0 0 650 114" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="highlights">
  <title>highlights</title>
  <style>
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .bar-top  { fill:#161B22; }
    .win-body { fill:#0D1117; stroke:#30363D; stroke-width:1; }
    .title    { fill:#8B949E; font-size:12px; }
    .cursor   { fill:#58A6FF; animation: blink 1s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity:1; } 50% { opacity:0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation:none; } }
  </style>
  <rect class="win-body" x="1" y="1" width="648" height="112" rx="10" />
  <rect class="bar-top"  x="1" y="1" width="648" height="34" rx="10" />
  <rect class="bar-top"  x="1" y="18" width="648" height="17" />
  <text x="18" y="23" class="title">highlights</text>
  <rect x="24" y="60" width="82" height="30" rx="15" fill="#161B22" stroke="#58A6FF" stroke-width="1.2" />
  <text x="65.0" y="80.0" text-anchor="middle" font-size="13" fill="#58A6FF">39 repos</text>
  <rect x="118" y="60" width="82" height="30" rx="15" fill="#161B22" stroke="#F1E05A" stroke-width="1.2" />
  <text x="159.0" y="80.0" text-anchor="middle" font-size="13" fill="#F1E05A">34 stars</text>
  <rect x="212" y="60" width="114" height="30" rx="15" fill="#161B22" stroke="#3FB950" stroke-width="1.2" />
  <text x="269.0" y="80.0" text-anchor="middle" font-size="13" fill="#3FB950">31 followers</text>
  <rect x="338" y="60" width="154" height="30" rx="15" fill="#161B22" stroke="#00ADD8" stroke-width="1.2" />
  <text x="415.0" y="80.0" text-anchor="middle" font-size="13" fill="#00ADD8">GitHub since 2021</text>
</svg>